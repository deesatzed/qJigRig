[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "qjig"
version = "0.0.0"
description = "Shared evidence and explicit decision workbench"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
# Explicit boundary: only the new qJig suite. Nested source suites under
# sources/ and the moved JIG folder are never collected here.
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-p no:cacheprovider"
